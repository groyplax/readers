}

function closeCompose() {
  composeMode = null;
  document.getElementById('compose').classList.remove('open');
  document.getElementById('composeOverlay').classList.remove('open');
  if (!document.getElementById('drawer').classList.contains('open')) document.body.style.overflow = '';
}
function updateComposeCount() {
  const n = countWords(document.getElementById('textInput').value);
  document.getElementById('composeCount').textContent =
    n.toLocaleString() + ' words' + (n ? ' · ~' + fmtMins(n / (175 * speechRate)) : '');
}

// Compose "Save": edit updates that book; new reuses an identical paste
// already in the library, otherwise creates a book.
function loadText() {
  const raw = document.getElementById('textInput').value;
  if (!raw.trim()) { document.getElementById('textInput').focus(); return; }
  const t = document.getElementById('titleInput').value.trim().slice(0, 120);
  const g = document.getElementById('groupInput').value.trim().slice(0, 60);
  const editing = composeMode && composeMode !== 'new';
  const books = getBooks();
  let book = editing ? books.find(b => b.id === composeMode) : books.find(b => b.text === raw);
  if (editing && !book) { closeCompose(); return; }
  if (!book) {
    book = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), words: 0, added: Date.now() };
    books.unshift(book);
  }
  book.text = raw;
  if (t) { book.title = t; book.customTitle = true; }
  else if (editing || !book.customTitle) { book.title = makeTitle(raw); book.customTitle = false; }
  if (g) book.group = g; else if (editing) delete book.group;
  book.words = countWords(raw);
  book.updated = Date.now();
  // Editing a different book from the library saves it without interrupting
  // what's open; new texts and edits to the open book (re)open it.
  const openIt = !editing || book.id === curBookId;
  if (openIt) book.opened = Date.now();
  if (!saveBooks(books)) { toast('Storage full — export a backup, then delete old texts'); return; }
  if (!editing) { try { localStorage.removeItem('vox_text'); } catch (e) {} }
  closeCompose();
  if (!openIt) {
    renderLibrary();
    toast('Saved changes to "' + book.title + '"');
    return;
  }
  if (book.id === curBookId) savePos();
  stopReading();
  curBookId = book.id;
  buildReader(raw);
  const pos = getPos(book.id);
  finishOpen(book, pos < words.length ? pos : 0);
  if (editing) toast('Saved changes to "' + book.title + '"');
}

function openBook(id) {
  const books = getBooks();
  const book = books.find(b => b.id === id);
  if (!book) return;
  book.opened = Date.now();
  saveBooks(books);
  stopReading();
  curBookId = id;
  buildReader(book.text);
  const pos = getPos(id);
  finishOpen(book, (pos >= 0 && pos < words.length) ? pos : 0);
}

// First word that is actually spoken (skips frontmatter etc.)
function firstSpoken() { const i = words.findIndex(w => w.spoken); return i < 0 ? 0 : i; }

function finishOpen(book, startWord) {
  if (!startWord) startWord = firstSpoken();
  try { localStorage.setItem('vox_last_book', book.id); } catch (e) {}
  setMediaTitle(book.title);
  curWord = startWord;
  if (words.length) {
    highlightWord(curWord);
    scrollToCurrent();
  }
  updatePositionSlider(); updateProgress(); updateReadTime(); updateMeta();
  renderLibrary();
  closeDrawer();
  const pct = words.length ? Math.round((curWord / Math.max(words.length - 1, 1)) * 100) : 0;
  setStatus(curWord > 0 ? 'Resumed "' + book.title + '" at ' + pct + '%' : 'Loaded "' + book.title + '"', '');
}

function clearReader() {
  stopReading();
  words = []; sentences = []; curWord = 0;
  const pane = document.getElementById('readerPane');
  pane.innerHTML = '';
  pane.appendChild(EMPTY_READER);
  document.getElementById('posSlider').value = 0;
  document.getElementById('posVal').textContent = '0%';
  applyPositionGradient(0);
  updateProgress(0); updateMeta();
  setMediaTitle(null);
  followPaused = false; updateFollowPill();
  chapters = []; document.getElementById('chaptersBtn').hidden = true;
}

// ════════════════════════════════════════
// TEXT → READER DOM (verbatim — the pane
// shows EXACTLY the pasted text; nothing
// is stripped or altered for display)
// ════════════════════════════════════════
// Sentence split that keeps every character: pieces concatenate back to the
// original paragraph. Abbreviations + decimals protected from splitting.
function splitSentences(text) {
  const abbrevPat = /\b(Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|etc|approx|dept|govt|incl|Vol|Capt|Col|Cpl|Gen|Pvt|Sgt|Lt|Ave|Blvd|Rd|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec|e\.g|i\.e)\./g;
  const safe = text.replace(abbrevPat, m => m.slice(0, -1) + '\x00')
                   .replace(/(\d)\.(\d)/g, '$1\x00$2');
  return safe.replace(/(\n)(?=[ \t]*\S)/g, '$1\x01')
             .replace(/([.!?…]+["'»‘’“”)\]]*)(\s+|$)/g, '$1$2\x01')
             .split('\x01')
             .map(s => s.replace(/\x00/g, '.'))
             .filter(s => s.length);
}
// What gets SPOKEN for a displayed word: markdown decoration characters are
// silently skipped in speech only. Display is never modified.
const DECOR = '[*_`#>|~\\[\\]()]';
const STRIP_DECOR = new RegExp(`(?<![\\p{L}\\p{N}])${DECOR}+|${DECOR}+(?![\\p{L}\\p{N}])`, 'gu');
function spokenForm(tok) {
  return tok.replace(STRIP_DECOR, '').replace(/(\d):(\d)/g, '$1 $2').trim();
}
// Character ranges that are never spoken (whole-text, so a span may cover
// several words). Words left with nothing to say are skipped in playback.
const FRONTMATTER = /^\uFEFF?---[ \t]*\r?\n(?:[A-Za-z_][\w -]*:[^\n]*\r?\n(?:[\s\S]*?\r?\n)?)?(?:---|\.\.\.)[ \t]*(?=\r?\n|$)/;
const SILENT_PATTERNS = [
  /%%[\s\S]*?%%/g,                          // Obsidian comment
  /!\[\[[^\]\n]*\]\]/g,                     // embed ![[file]]
  /\[\[[^\]|\n]*\|/g,                        // wikilink target before alias: [[Target|
  /\]\((?:[^()\s]|\([^()\s]*\))*\)/g,        // link/image target: ](url)
  /<?\bhttps?:\/\/[^\s<>]+>?/g,             // bare URL
  /\[\^[^\]\s]+\]/g,                        // footnote ref [^1]
  /==(?=[^=\s])|(?<=[^=\s])==/g,            // ==highlight== marks
];
function silentMask(text) {
  const m = new Uint8Array(text.length);
  const fm = text.match(FRONTMATTER);
  if (fm) m.fill(1, 0, fm[0].length);
  SILENT_PATTERNS.forEach(re => {
    for (const x of text.matchAll(re)) m.fill(1, x.index, x.index + x[0].length);
  });
  return m;
}

function buildReader(text) {
  stopReading();
  const pane = document.getElementById('readerPane');
  pane.innerHTML = '';
  words = []; sentences = [];
  curWord = 0;

  const units = [];
  const silent = silentMask(text);
  // Paragraphs with their start offset in `text` (pieces/tokens below
  // concatenate back to the paragraph exactly, so offsets stay aligned).
  const paras = [];
  let pStart = 0;
  for (const m of text.matchAll(/\n\s*\n/g)) {
    paras.push([text.slice(pStart, m.index), pStart]);
    pStart = m.index + m[0].length;
  }
  paras.push([text.slice(pStart), pStart]);

  paras.filter(([para]) => para.trim()).forEach(([para, off]) => {
    const paraDiv = document.createElement('div');
    paraDiv.className = 'para';

    splitSentences(para).forEach(piece => {
      let unit = { el: document.createElement('span'), words: [] };
      unit.el.className = 'sentence';
      paraDiv.appendChild(unit.el);
      units.push(unit);

      piece.split(/(\s+)/).forEach(tok => {
        const tokOff = off;
        off += tok.length;
        if (!tok) return;
        if (/^\s+$/.test(tok)) {
          unit.el.appendChild(document.createTextNode(tok));
          return;
        }
        // Cap unit length so a run-on "sentence" never becomes a giant utterance
        if (unit.words.length >= MAX_UNIT_WORDS) {
          unit = { el: document.createElement('span'), words: [] };
          unit.el.className = 'sentence';
          paraDiv.appendChild(unit.el);
          units.push(unit);
        }
        if (WORD_CHAR.test(tok)) {
          const w = document.createElement('span');
          w.className = 'word';
          w.textContent = tok;
          let audible = '';
          for (let i = 0; i < tok.length; i++) if (!silent[tokOff + i]) audible += tok[i];
          const obj = {
            el: w,
            spoken: spokenForm(audible),
            sentIdx: 0,
            globalIdx: words.length,
            sentenceEl: null,
            off: tokOff,
          };
          w.addEventListener('click', () => seekToWord(obj.globalIdx));
          unit.words.push(obj);
          words.push(obj);
          unit.el.appendChild(w);
        } else {
          unit.el.appendChild(document.createTextNode(tok));
        }
      });
    });

    pane.appendChild(paraDiv);
  });

  sentences = units.filter(u => u.words.length);
  sentences.forEach((s, i) => s.words.forEach(w => { w.sentIdx = i; w.sentenceEl = s.el; }));
  buildChapters(text);

  pane.scrollTop = 0;
  if (!words.length) {
    pane.innerHTML = '<div class="reader-empty">No readable words found in that text.</div>';
  }
}

// ════ CHAPTERS ═══════════════════════════
// Markdown headings (outside frontmatter / code fences) → jump list.
// Fallback when there are none: standalone "Chapter 3" / "Part II" lines.
let chapters = [];  // { title, level, word }
function buildChapters(text) {
  chapters = [];
  const skip = new Uint8Array(text.length);
  const fm = text.match(FRONTMATTER);
  if (fm) skip.fill(1, 0, fm[0].length);
  for (const m of text.matchAll(/^(`{3,}|~{3,})[^\n]*\n[\s\S]*?^\1[ \t]*$/gm)) skip.fill(1, m.index, m.index + m[0].length);
  let found = [];
  for (const m of text.matchAll(/^(#{1,6})[ \t]+(.+?)[ \t#]*$/gm)) {
    if (!skip[m.index]) found.push({ off: m.index, level: m[1].length, title: m[2] });
  }
  if (!found.length) {
    for (const m of text.matchAll(/^[ \t]*((?:chapter|part|book|prologue|epilogue|introduction|preface)\b[^\n]{0,60})$/gim)) {
      if (!skip[m.index]) found.push({ off: m.index, level: 1, title: m[1] });
    }
  }
  let wi = 0;
  found.forEach(h => {
    while (wi < words.length && words[wi].off < h.off) wi++;
    if (wi >= words.length || (chapters.length && chapters[chapters.length - 1].word === wi)) return;
    const title = h.title.replace(/[*_`\[\]=]/g, '').trim();
    if (title) chapters.push({ title: title.slice(0, 90), level: h.level, word: wi });
  });
  document.getElementById('chaptersBtn').hidden = chapters.length < 2;
}
function chapterAt(g) {
  let c = -1;
  for (let i = 0; i < chapters.length && chapters[i].word <= g; i++) c = i;
  return c;
}
function renderChapters() {
  const m = document.getElementById('chaptersMenu');
  m.innerHTML = '';
  const cur = chapterAt(curWord);
  const minLevel = Math.min(...chapters.map(c => c.level));
  chapters.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'menu-item' + (i === cur ? ' active' : '');
    b.style.paddingLeft = (10 + (c.level - minLevel) * 14) + 'px';
    b.textContent = c.title;
    b.title = c.title;
    b.addEventListener('click', () => { closeMenus(); seekToWord(c.word); scrollToCurrent(); });
    m.appendChild(b);
  });
  setTimeout(() => { const a = m.querySelector('.active'); if (a) a.scrollIntoView({ block: 'center' }); }, 0);
}

// ════ SLEEP TIMER ════════════════════════
// Counts down only while playing; "end of chapter" pauses at the next heading.
let sleepLeft = null;  // ms remaining | 'chapter' | null (off)
function setSleep(v) {
  sleepLeft = v;
  closeMenus();
  updateSleepBtn();
  if (v !== null) toast(v === 'chapter' ? 'Sleep timer: stops at the end of this chapter' : 'Sleep timer: ' + Math.round(v / 60000) + ' min');
}
function updateSleepBtn() {
  const b = document.getElementById('sleepBtn');
  b.textContent = sleepLeft === null ? '☾ Sleep' : sleepLeft === 'chapter' ? '☾ Chapter' : '☾ ' + Math.ceil(sleepLeft / 60000) + 'm';
  b.classList.toggle('on', sleepLeft !== null);
}
function renderSleepMenu() {
  const m = document.getElementById('sleepMenu');
  m.innerHTML = '';
  const opts = [['Off', null], ['15 min', 15], ['30 min', 30], ['45 min', 45], ['60 min', 60]];
  if (chapters.length >= 2) opts.push(['End of chapter', 'chapter']);
  opts.forEach(([label, v]) => {
    const b = document.createElement('button');
    const isOn = v === null ? sleepLeft === null : v === 'chapter' ? sleepLeft === 'chapter' : false;
    b.className = 'menu-item' + (isOn ? ' active' : '');
    b.textContent = label;
    b.addEventListener('click', () => setSleep(v === null || v === 'chapter' ? v : v * 60000));
    m.appendChild(b);
  });
}
function sleepFire() {
  sleepLeft = null;
  updateSleepBtn();
  pauseReading();
  setStatus('Sleep timer — paused', 'paused');
}
setInterval(() => {
  if (typeof sleepLeft !== 'number' || !wantPlaying) return;
  sleepLeft -= 1000;
  if (sleepLeft <= 0) sleepFire(); else updateSleepBtn();
}, 1000);

// ════════════════════════════════════════
// PLAYBACK — sentence queue. Each sentence
// is its own short utterance; onend chains
// to the next. Short utterances = reliable
// boundaries, clean pause, no mid-text
// engine death on long documents.
// ════════════════════════════════════════
function togglePlay() {
  if (!words.length) { newEntry(); return; }
  if (wantPlaying) { pauseReading(); return; }
  wantPlaying = true;
  stallRetries = 0;
  startedSincePlay = false;
  if (followPaused) resumeFollow();
  startKeepAlive();
  const start = curWord >= words.length ? 0 : curWord;
  speakFrom(start);
}

function speakFrom(g) {
  if (!words.length) return;
  g = Math.max(0, Math.min(g, words.length - 1));
  cancelPendingRestart();
  if (synth.speaking || synth.pending) { activeUtterance = null; synth.cancel(); }
  playing = true;
  setPlayBtn(true);
  setStatus(startedSincePlay ? 'Playing…' : 'Starting…', 'playing');
  setCurrentWord(g);
  speakUnit(g);
}

function speakUnit(g) {
  const sIdx = words[g].sentIdx;
  const sent = sentences[sIdx];
  const chunk = sent.words.filter(w => w.globalIdx >= g && w.spoken);
  if (!chunk.length) { advanceFrom(sIdx); return; }

  let text = ''; const starts = [];
  chunk.forEach((w, i) => { if (i) text += ' '; starts.push(text.length); text += w.spoken; });

  const u = new SpeechSynthesisUtterance(text);
  u.rate = engineRate(speechRate);
  const v = getSelectedVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }

  // Before audio starts / between word events: STALL_MS. Voices that emit no
  // boundary events get the whole estimated utterance length plus slack.
  const estMs = chunk.length * 60000 / (150 * speechRate);
  u._stallLimit = startedSincePlay ? STALL_MS : START_STALL_MS;
  u.onboundary = (e) => {
    lastSpeechProgress = performance.now();
    u._stallLimit = STALL_MS;
    if (e.name !== 'word') return;
    let idx = 0;
    for (let i = starts.length - 1; i >= 0; i--) {
      if (starts[i] <= e.charIndex) { idx = i; break; }
    }
    const w = chunk[idx];
    if (w.globalIdx !== curWord) setCurrentWord(w.globalIdx);
  };

  let speakT0 = performance.now();
  const speakWordCount = chunk.length;
  u.onstart = () => {
    speakT0 = lastSpeechProgress = performance.now();
    u._stallLimit = Math.max(STALL_MS, estMs * 2 + 3000);
    if (!startedSincePlay || stallRetries) setStatus('Playing…', 'playing');
    startedSincePlay = true;
  };

  u.onend = () => {
    if (u !== activeUtterance || !playing) return;

    if (speakWordCount >= 4) {
      const elapsed = performance.now() - speakT0;
      if (elapsed >= 1000) {
        const wpm = speakWordCount / (elapsed / 60000);
        if (speechRate !== lastWpmRate || selectedVoiceName !== lastWpmVoice) {
          measuredWpm = wpm;
          lastWpmRate = speechRate;
          lastWpmVoice = selectedVoiceName;
        } else {
          measuredWpm = measuredWpm != null ? measuredWpm * 0.7 + wpm * 0.3 : wpm;
        }
        updateReadTime();
        if (/[?&]debug/.test(location.search)) {
          const dbg = document.getElementById('voiceDebug');
          dbg.style.display = 'block';
          const line = `slider ${speechRate.toFixed(1)}× → engine ${engineRate(speechRate).toFixed(2)} | measured ${Math.round(wpm)} wpm | avg ${Math.round(measuredWpm)} wpm | ${selectedVoiceName || 'default'}`;
          const parts = dbg.textContent.split('── WPM ──');
          dbg.textContent = parts[0].trimEnd() + '\n── WPM ──\n' + line;
        }
      }
    }

    activeUtterance = null;
    stallRetries = 0;
    advanceFrom(sIdx);
  };
  u.onerror = (e) => {
    if (e.error === 'canceled' || e.error === 'interrupted') return;
    if (u !== activeUtterance) return;
    activeUtterance = null;
    wantPlaying = false;
    playing = false;
    setPlayBtn(false);
    stopKeepAlive();
    setStatus('Speech error (' + (e.error || 'unknown') + ') — tap play to continue', '');
    savePos();
  };

  activeUtterance = u;
  lastSpeechProgress = performance.now();
  if (synth.paused) synth.resume();  // a paused engine queues silently
  synth.speak(u);
}

function advanceFrom(sIdx) {
  if (!playing) return;
  const next = sentences[sIdx + 1];
  if (!next) { finishedReading(); return; }
  const g = next.words[0].globalIdx;
  setCurrentWord(g);
  if (sleepLeft === 'chapter' && chapters.some(c => c.word === g)) { sleepFire(); return; }
  speakUnit(g);
}

function finishedReading() {
  if (sleepLeft !== null) { sleepLeft = null; updateSleepBtn(); }
  wantPlaying = false;
  playing = false;
  activeUtterance = null;
  stopKeepAlive();
  curWord = words.length;
  clearHighlights();
  setPlayBtn(false);
  setStatus('Finished', '');
  updateProgress(100);
  updateReadTime();
  savePos();
}

function pauseReading() {
  wantPlaying = false;
  cancelPendingRestart();
  activeUtterance = null;
  synth.cancel();
  playing = false;
  setPlayBtn(false);
  stopKeepAlive();
  setStatus('Paused', 'paused');
  savePos();
}

function stopReading(resetHL = true) {
  wantPlaying = false;
  cancelPendingRestart();
  activeUtterance = null;
  synth.cancel();
  playing = false;
  if (resetHL) clearHighlights();
  setPlayBtn(false);
  stopKeepAlive();
  setStatus('Ready', '');
}

function restartBook() {
  if (!words.length) return;
  seekToWord(firstSpoken());
  document.getElementById('readerPane').scrollTop = 0;
}

function skipSentence(dir) {
  if (!words.length) return;
  const atEnd = curWord >= words.length;
  let sIdx = atEnd ? sentences.length - 1 : words[curWord].sentIdx;
  const sentStart = sentences[sIdx].words[0].globalIdx;
  // Back from mid-sentence goes to the start of the CURRENT sentence first
  if (!(dir < 0 && !atEnd && curWord > sentStart)) {
    sIdx = Math.max(0, Math.min(sentences.length - 1, sIdx + dir));
  }
  seekToWord(sentences[sIdx].words[0].globalIdx);
}

// ════════════════════════════════════════
// HIGHLIGHT + POSITION
// ════════════════════════════════════════
function setCurrentWord(g) {
  curWord = g;
  highlightWord(g);
  updatePositionSlider(); updateProgress(); updateReadTime();
  if (curBookId && g % 10 === 0) savePos();
}

// ════ FOLLOW ═════════════════════════════
// Auto-scroll keeps the spoken word in view, unless the reader has scrolled
// the pane themselves (to reread / look ahead): then it waits, and a
// "Back to current" pill appears until they return or tap it.
let followPaused = false;
let lastScrollIntent = 0;
function wordInView(el) {
  const pane = document.getElementById('readerPane');
  return el.offsetTop + el.offsetHeight > pane.scrollTop && el.offsetTop < pane.scrollTop + pane.clientHeight;
}
function updateFollowPill() {
  const w = words[Math.min(curWord, words.length - 1)];
  if (followPaused && (!w || wordInView(w.el))) followPaused = false;
  document.getElementById('followPill').hidden = !followPaused;
}
function resumeFollow() {
  followPaused = false;
  updateFollowPill();
  const w = words[Math.min(curWord, words.length - 1)];
  const pane = document.getElementById('readerPane');
  if (w) pane.scrollTo({ top: w.el.offsetTop - pane.clientHeight * 0.4, behavior: 'smooth' });
}
(function () {
  const pane = document.getElementById('readerPane');
  const intent = () => { lastScrollIntent = performance.now(); };
  ['wheel', 'touchmove', 'keydown'].forEach(ev => pane.addEventListener(ev, intent, { passive: true }));
  let raf = 0;
  pane.addEventListener('scroll', () => {
    if (!words.length) return;
    if (performance.now() - lastScrollIntent < 400) followPaused = true;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; updateFollowPill(); });
  }, { passive: true });
})();

function highlightWord(idx) {
  if (!words[idx]) return;
  const { el, sentenceEl } = words[idx];
  clearHighlights();
  el.classList.add('active-word');
  sentenceEl.classList.add('active-sentence');
  lastHighlightWord = el;
  lastHighlightSentence = sentenceEl;
  if (followPaused) { updateFollowPill(); return; }
  const pane = document.getElementById('readerPane');
  const elTop = el.offsetTop;
  const elBot = elTop + el.offsetHeight;
  const viewTop = pane.scrollTop;
  const viewBot = viewTop + pane.clientHeight;
  const margin = 60;
  if (elTop < viewTop + margin || elBot > viewBot - margin) {
    pane.scrollTo({ top: elTop - pane.clientHeight * 0.4, behavior: 'smooth' });
  }
}

function scrollToCurrent() {
  followPaused = false; updateFollowPill();
  const w = words[Math.min(curWord, words.length - 1)];
  if (!w) return;
  const pane = document.getElementById('readerPane');
  pane.scrollTop = Math.max(0, w.el.offsetTop - pane.clientHeight * 0.3);
}

function clearHighlights() {
  if (lastHighlightSentence) { lastHighlightSentence.classList.remove('active-sentence'); lastHighlightSentence = null; }
  if (lastHighlightWord) { lastHighlightWord.classList.remove('active-word'); lastHighlightWord = null; }
}

function pctOf(g) { return Math.round(Math.min(g, words.length) / Math.max(words.length - 1, 1) * 100); }

function seekToWord(g) {
  if (!words.length) return;
  g = Math.max(0, Math.min(g, words.length - 1));
  // A jump of more than a sentence or two (restart, slider, stray tap)
  // offers a way back for a few seconds.
  const from = curWord;
  const fromSent = from >= words.length ? sentences.length : words[from].sentIdx;
  if (Math.abs(words[g].sentIdx - fromSent) > 2) {
    toast('Jumped to ' + pctOf(g) + '%', { label: '↩ Back to ' + pctOf(from) + '%', run: () => seekToWord(from) });
  }
  followPaused = false;
  const was = wantPlaying;
  if (synth.speaking || synth.pending) {
    activeUtterance = null;
    synth.cancel();
  }
  setCurrentWord(g);
  savePos();
  if (was) restartAt(g, 150);
}

function seekPositionDisplay(pct) {
  document.getElementById('posVal').textContent = Math.round(pct) + '%';
  applyPositionGradient(pct);
}
function seekPositionCommit(pct) {
  if (!words.length) return;
  seekToWord(Math.round((pct / 100) * (words.length - 1)));
}

function updatePositionSlider() {
  if (!words.length || posSliderActive) return;
  const pct = (Math.min(curWord, words.length) / Math.max(words.length - 1, 1)) * 100;
  document.getElementById('posSlider').value = pct;
  document.getElementById('posVal').textContent = Math.round(Math.min(pct, 100)) + '%';
  applyPositionGradient(Math.min(pct, 100));
}

function updateProgress(force) {
  const pct = force !== undefined ? force
    : words.length ? (Math.min(curWord, words.length) / Math.max(words.length - 1, 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
}

// ════════════════════════════════════════
// META / READ TIME
// ════════════════════════════════════════
// Pasting Markdown (e.g. from Obsidian's editor) gets the same link cleanup.
document.getElementById('textInput').addEventListener('paste', (e) => {
  const t = e.clipboardData && e.clipboardData.getData('text/plain');
  if (!t) return;
  const u = unlinkMarkdown(t);
  if (!u.links) return;  // nothing to clean: let the browser paste normally
  e.preventDefault();
  const ta = e.target;
  ta.setRangeText(u.text, ta.selectionStart, ta.selectionEnd, 'end');
  ta.dispatchEvent(new Event('input'));
  linkToast(u.links);
});
document.getElementById('textInput').addEventListener('input', () => {
  updateComposeCount();
  if (composeMode !== 'new') return;  // only unsaved new pastes are drafts
  if (draftSaveTimer) clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(() => {
    const v = document.getElementById('textInput').value;
    try { localStorage.setItem('vox_text', v); } catch (e) {}
  }, 300);
});

function updateMeta() { updateReadTime(); }

function updateReadTime() {
  const total = words.length;
  const left = Math.max(total - curWord, 0);
  const effectiveWpm = measuredWpm || (175 * speechRate);
  document.getElementById('wordCount').textContent =
    total.toLocaleString() + ' words' + (total ? ' · ' + Math.min(pctOf(curWord), 100) + '%' : '');
  document.getElementById('readTime').textContent =
    !total ? '' : left === 0 ? 'Finished' : fmtMins(left / effectiveWpm) + ' left';
}

// ════════════════════════════════════════
// SPEED / FONT / THEME / STATUS / PASTE
// ════════════════════════════════════════
function applySpeedGradient(val) {
  const pct = ((val - 0.5) / 2.5) * 100;
  document.getElementById('speedSlider').style.background =
    `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, var(--border) ${pct}%, var(--border) 100%)`;
}
function fmtRate(r) { return (Math.round(r * 100) % 10 ? r.toFixed(2) : r.toFixed(1)) + '×'; }
const SPEED_PRESETS = [0.8, 1, 1.25, 1.5, 1.75, 2];
function renderSpeedMenu() {
  const m = document.getElementById('speedMenu');
  m.innerHTML = '';
  SPEED_PRESETS.forEach(r => {
    const b = document.createElement('button');
    b.className = 'menu-item' + (Math.abs(r - speechRate) < 0.001 ? ' active' : '');
    b.textContent = fmtRate(r);
    b.addEventListener('click', () => {
      document.getElementById('speedSlider').value = r;
      updateSpeedDisplay(r); updateSpeedCommit(r);
      closeMenus();
    });
    m.appendChild(b);
  });
}
function updateSpeedDisplay(val) {
  speechRate = parseFloat(val);
  document.getElementById('speedVal').textContent = fmtRate(speechRate);
  applySpeedGradient(val);
  updateReadTime();
}
function updateSpeedCommit(val) {
  speechRate = parseFloat(val);
  measuredWpm = null;
  try { localStorage.setItem('vox_speed', speechRate); } catch (e) {}
  if (wantPlaying) restartAt(curWord, 150);
}

function changeFontSize(delta) {
  fontSize = Math.max(12, Math.min(30, fontSize + delta));
  document.getElementById('readerPane').style.fontSize = fontSize + 'px';
  document.getElementById('fontSizeVal').textContent = fontSize + ' px';
  try { localStorage.setItem('vox_fontSize', fontSize); } catch (e) {}
}

function setTheme(name) {
  if (!THEMES.some(t => t[0] === name)) name = 'dark';
  currentTheme = name;
  const root = document.documentElement;
  root.classList.add('theme-switching');
  THEMES.forEach(([k]) => document.body.classList.remove('theme-' + k));
  if (name !== 'dark') document.body.classList.add('theme-' + name);
  void root.offsetHeight;  // apply the new colours with transitions off
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-switching')));
  document.querySelectorAll('.theme-tile').forEach(t => t.classList.toggle('active', t.dataset.theme === name));
  try { localStorage.setItem('vox_theme', name); localStorage.setItem('vox_theme_rev', '2'); } catch (e) {}
}

function setFont(key) {
  const f = FONTS.find(x => x[0] === key) || FONTS[0];
  currentFont = f[0];
  document.getElementById('readerPane').style.fontFamily = f[2];
  document.querySelectorAll('.font-tile').forEach(t => t.classList.toggle('active', t.dataset.font === f[0]));
  try { localStorage.setItem('vox_font', f[0]); } catch (e) {}
}

function setSpacing(key) {
  if (!SPACING[key]) key = 'normal';
  currentSpacing = key;
  document.getElementById('readerPane').style.lineHeight = SPACING[key];
  document.querySelectorAll('#spacingRow .font-tile').forEach(t => t.classList.toggle('active', t.dataset.spacing === key));
  try { localStorage.setItem('vox_spacing', key); } catch (e) {}
  if (words.length && !followPaused) scrollToCurrent();
}
function setPageWidth(key) {
  if (!PAGE_WIDTHS[key]) key = 'narrow';
  currentWidth = key;
  document.documentElement.style.setProperty('--col-max', PAGE_WIDTHS[key]);
  document.querySelectorAll('#widthRow .font-tile').forEach(t => t.classList.toggle('active', t.dataset.width === key));
  try { localStorage.setItem('vox_width', key); } catch (e) {}
  if (words.length && !followPaused) scrollToCurrent();
}
function setBold(on) {
  boldText = !!on;
  document.getElementById('readerPane').classList.toggle('bold-text', boldText);
  const t = document.getElementById('boldToggle');
  t.classList.toggle('active', boldText);
  t.setAttribute('aria-checked', String(boldText));
  try { localStorage.setItem('vox_bold', boldText ? '1' : '0'); } catch (e) {}
}

// ════ DISPLAY MENU ═══════════════════════
function renderFontGrid() {
  const grid = document.getElementById('fontGrid');
  FONTS.forEach(([key, label, stack]) => {
    const t = document.createElement('button');
    t.className = 'font-tile';
    t.dataset.font = key;
    t.style.fontFamily = stack;
    t.textContent = label;
    t.setAttribute('aria-label', label + ' font');
    t.addEventListener('click', () => setFont(key));
    grid.appendChild(t);
  });
}
function renderThemeGrid() {
  const grid = document.getElementById('themeGrid');
  THEMES.forEach(([key, label]) => {
    const t = document.createElement('button');
    t.className = 'theme-tile theme-' + key;
    t.dataset.theme = key;
    t.setAttribute('aria-label', label + ' theme');
    t.innerHTML = '<span class="tt-aa">A<i>a</i></span><span class="tt-name"></span>';
    t.querySelector('.tt-name').textContent = label;
    t.addEventListener('click', () => setTheme(key));
    grid.appendChild(t);
  });
}
// Header popovers; at most one open. Each menu id maps to its button.
const MENUS = { sizeMenu: 'aaBtn', themeMenu: 'themeBtn', speedMenu: 'speedVal', chaptersMenu: 'chaptersBtn', sleepMenu: 'sleepBtn' };
const MENU_SEL = Object.entries(MENUS).map(([m, b]) => '#' + m + ', #' + b).join(', ');
function openMenu() { return Object.keys(MENUS).find(id => !document.getElementById(id).hidden) || null; }
function toggleMenu(id, force) {
  const open = force !== undefined ? force : document.getElementById(id).hidden;
  Object.keys(MENUS).forEach(m => {
    const on = m === id && open;
    document.getElementById(m).hidden = !on;
    document.getElementById(MENUS[m]).setAttribute('aria-expanded', String(on));
  });
}
function closeMenus() { toggleMenu(null, false); }
document.addEventListener('click', (e) => {
  if (openMenu() && !e.target.closest(MENU_SEL)) closeMenus();
});

// Messages from the library/compose land here: the status row sits under
// the drawer, so anything said while it's open would go unseen.
let toastTimer = null;
function toast(text, action) {
  const el = document.getElementById('toast');
  el.textContent = '';
  const msg = document.createElement('span');
  msg.textContent = text;
  el.appendChild(msg);
  if (action) {
    const b = document.createElement('button');
    b.className = 'toast-act';
    b.textContent = action.label;
    b.addEventListener('click', (e) => { e.stopPropagation(); el.classList.remove('show'); action.run(); });
    el.appendChild(b);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 10000 : Math.max(2500, text.length * 60));
}
function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function setStatus(text, state) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'status-dot' + (state ? ' ' + state : '');
}
function setPlayBtn(p) {
  const btn = document.getElementById('playBtn');
  btn.textContent = p ? '⏸' : '▶';
  btn.classList.toggle('playing', p);
}

function applyPositionGradient(pct) {
  document.getElementById('posSlider').style.background =
    `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, var(--border) ${pct}%, var(--border) 100%)`;
}

// ════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (composeMode) {
    if (e.key === 'Escape') closeCompose();
    else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); loadText(); }
    return;
  }
  const t = e.target;
  if (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'range')) {
    if (e.key === 'Escape') closeDrawer();
    return;
  }
  // (A focused Speed/Position slider falls through: arrows/Space stay
  // playback shortcuts instead of nudging the slider.)
  if (e.key === 'Escape') { if (openMenu()) closeMenus(); else closeDrawer(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'l' || e.key === 'L') { toggleDrawer(); return; }
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); skipSentence(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); skipSentence(1); }
  else if (t.type === 'range' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') { restartBook(); }
});

// Save reading position and handle background/resume on iPhone
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    savePos();
    resumeOnReturn = wantPlaying;
  } else {
    const engineActive = synth.speaking || synth.pending;
    if (resumeOnReturn && (IS_IOS || !engineActive)) {
      startKeepAlive();
      restartAt(curWord, VOICE_SWITCH_DELAY);
    } else if (wantPlaying && !engineActive) {
      wantPlaying = false;
      playing = false;
      setPlayBtn(false);
      stopKeepAlive();
      setStatus('Paused (backgrounded)', 'paused');
      savePos();
    }
    resumeOnReturn = false;
  }
});
window.addEventListener('pagehide', savePos);

if (KEEPALIVE && 'mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (!wantPlaying) togglePlay(); });
  navigator.mediaSession.setActionHandler('pause', () => pauseReading());
  navigator.mediaSession.setActionHandler('nexttrack', () => skipSentence(1));
  navigator.mediaSession.setActionHandler('previoustrack', () => skipSentence(-1));
}

// ════════════════════════════════════════
// INIT — restore persisted state
// ════════════════════════════════════════
(function () {
  renderThemeGrid();
  setTheme(currentTheme);
  renderFontGrid();
  setFont(currentFont);
  setSpacing(currentSpacing);
  setPageWidth(currentWidth);
  setBold(boldText);
  document.getElementById('readerPane').style.fontSize = fontSize + 'px';
  document.getElementById('fontSizeVal').textContent = fontSize + ' px';
  const ss = document.getElementById('speedSlider');
  ss.value = speechRate;
  document.getElementById('speedVal').textContent = fmtRate(speechRate);
  applySpeedGradient(speechRate);
  applyPositionGradient(0);

  const ps = document.getElementById('posSlider');
  const begin = () => { posSliderActive = true; };
  const end   = () => { posSliderActive = false; };
  ps.addEventListener('pointerdown', begin);
  ps.addEventListener('pointerup', end);
  ps.addEventListener('pointercancel', end);
  ps.addEventListener('touchstart', begin, { passive: true });
  ps.addEventListener('touchend', end);

  // Auto-titled notes saved before frontmatter support were titled "---";
  // re-derive only titles that still match the old first-line rule.
  const books = getBooks();
  let retitled = false;
  books.forEach(b => {
    if (b.customTitle || b.title !== titleFromLine(b.text)) return;
    const t = makeTitle(b.text);
    if (t !== b.title) { b.title = t; retitled = true; }
  });
  if (retitled) saveBooks(books);

  renderLibrary();
  // Best effort: ask the browser not to evict the library (Safari may
  // otherwise clear site data after ~7 days without a visit).
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // Reopen the last book at its saved position; else restore unsaved draft
  const lastId = localStorage.getItem('vox_last_book');
  if (lastId && getBooks().some(b => b.id === lastId)) {
    openBook(lastId);
  } else {
    updateMeta();
  }
})();
</script>
</body>
</html>
