<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vox Reader</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&family=JetBrains+Mono:wght@400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root, .theme-dark {
    --bg: #0e0c0a;
    --surface: #1a1714;
    --surface2: #231f1b;
    --border: #2e2924;
    --text: #e8e0d4;
    --text-muted: #8a7f74;
    --accent: #c8956b;
    --accent2: #d4a67a;
    --hl-word: #f0a870;
    --hl-sentence: rgba(200,149,107,0.13);
    --on-accent: var(--bg);
    --radius: 12px;
    --tr: 0.2s ease;
    --header-h: 52px;
  }
  .theme-light {
    --bg: #f4efe8; --surface: #fffcf7; --surface2: #ede8e0;
    --border: #d8cfc4; --text: #2a2420; --text-muted: #8a7f74;
    --accent: #b5743e; --accent2: #c47f42;
    --hl-word: #a0581e; --hl-sentence: rgba(181,116,62,0.1);
    --on-accent: #fff;
  }
  .theme-sepia {
    --bg: #f4ecd8; --surface: #faf4e6; --surface2: #ece1c6;
    --border: #d8c8a4; --text: #5b4636; --text-muted: #8a7356;
    --accent: #9a5a28; --accent2: #aa6832;
    --hl-word: #7f3a10; --hl-sentence: rgba(154,90,40,0.13);
    --on-accent: #fff;
  }
  .theme-parchment {
    --bg: #e6d9bc; --surface: #efe5cd; --surface2: #ddcdaa;
    --border: #c6b28a; --text: #463626; --text-muted: #76634a;
    --accent: #87552a; --accent2: #976232;
    --hl-word: #72300e; --hl-sentence: rgba(135,85,42,0.15);
    --on-accent: #fff;
  }
  .theme-sage {
    --bg: #e1e7da; --surface: #ecf0e6; --surface2: #d7dfcd;
    --border: #bcc8ae; --text: #33402e; --text-muted: #647260;
    --accent: #4a7341; --accent2: #57824d;
    --hl-word: #2c5a24; --hl-sentence: rgba(74,115,65,0.14);
    --on-accent: #fff;
  }
  .theme-mocha {
    --bg: #2a2218; --surface: #322919; --surface2: #3c3121;
    --border: #4a3e2c; --text: #e8d8bc; --text-muted: #9a8860;
    --accent: #d4a060; --accent2: #e0b070;
    --hl-word: #f0b870; --hl-sentence: rgba(212,160,96,0.15);
  }
  .theme-slate {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --border: #30363d; --text: #e6edf3; --text-muted: #7d8590;
    --accent: #58a6ff; --accent2: #79c0ff;
    --hl-word: #79c0ff; --hl-sentence: rgba(88,166,255,0.1);
  }
  .theme-forest {
    --bg: #0b1a0b; --surface: #112011; --surface2: #182d18;
    --border: #2a4a2a; --text: #d0e8d0; --text-muted: #6a966a;
    --accent: #5cb85c; --accent2: #78cc78;
    --hl-word: #78cc78; --hl-sentence: rgba(92,184,92,0.12);
  }
  .theme-ocean {
    --bg: #060f1c; --surface: #0c1b30; --surface2: #112440;
    --border: #1a3558; --text: #c8dff8; --text-muted: #5a88b8;
    --accent: #4ca8e0; --accent2: #68bce8;
    --hl-word: #68bce8; --hl-sentence: rgba(76,168,224,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* Set for a moment while switching theme so nothing fades between themes */
  .theme-switching, .theme-switching * { transition: none !important; }

  body {
    font-family: 'Lora', Georgia, serif;
    background: var(--bg);
    color: var(--text);
    padding-top: var(--header-h);
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }

  /* ── HEADER ────────────────────────────── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 300;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem; font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }
  .logo span { color: var(--text-muted); font-style: italic; font-weight: 400; }

  .header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .hdr-title {
    min-width: 0; max-width: 100%; padding: 4px 2px; cursor: pointer;
    background: none; border: none; color: var(--text); text-align: left;
    font-family: 'Playfair Display', serif; font-size: 1.02rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    -webkit-appearance: none;
  }
  .hdr-title:active { color: var(--accent); }
  .hamburger-btn {
    background: none; border: none;
    color: var(--text); font-size: 1.4rem;
    cursor: pointer; padding: 2px 4px;
    display: flex; align-items: center;
    -webkit-appearance: none;
  }
  .hamburger-btn:active { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 10px; }

  .rsvp-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.05em;
    color: var(--text-muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 7px;
  }

  .aa-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); height: 30px; min-width: 40px; padding: 0 10px;
    border-radius: 8px; cursor: pointer;
    font-family: 'Playfair Display', serif; font-size: 0.95rem;
    -webkit-appearance: none;
  }
  .aa-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .theme-toggle { min-width: 30px; width: 30px; padding: 0; display: flex; align-items: center; justify-content: center; }
  /* Swatch previews the current theme: page colour + accent */
  .theme-swatch {
    width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(135deg, var(--bg) 50%, var(--accent) 50%);
    box-shadow: 0 0 0 1px var(--text-muted);
  }

  /* ── DISPLAY MENU (text size + theme) ─── */
  .display-menu {
    position: fixed; z-index: 350;
    top: calc(var(--header-h) + 6px); right: 10px;
    width: min(320px, calc(100vw - 20px));
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.35);
    padding: 12px 14px 14px;
  }
  .display-menu[hidden] { display: none; }
  .font-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .dm-label-gap { margin-top: 14px; }
  .font-tile {
    height: 46px; cursor: pointer; padding: 0 4px;
    background: var(--surface2); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 0.9rem; line-height: 1.1;
    -webkit-appearance: none;
  }
  .font-tile.active { border: 2px solid var(--accent); color: var(--accent); }
  .opt-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .opt-row .font-tile { font-family: 'Lora', serif; height: 40px; }
  .bold-toggle { width: 100%; margin-top: 14px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
  .bold-toggle .sw {
    width: 34px; height: 20px; border-radius: 999px; position: relative;
    background: var(--border); flex-shrink: 0;
  }
  .bold-toggle .sw::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--surface);
  }
  .bold-toggle.active .sw { background: var(--accent); }
  .bold-toggle.active .sw::after { left: 16px; }
  #readerPane.bold-text { font-weight: 600; }
  /* Page width only matters on wide screens */
  @media (max-width: 820px) { .width-opt { display: none; } }
  .dm-label {
    font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); margin: 2px 0 8px;
  }
  .dm-size { display: flex; align-items: center; gap: 8px; }
  .dm-step {
    flex: 1; height: 40px; cursor: pointer;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; font-size: 0.95rem;
    -webkit-appearance: none;
  }
  .dm-step:active { border-color: var(--accent); }
  .dm-size-val {
    min-width: 54px; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted);
  }
  .dm-themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  /* Each tile carries its own theme class, so it previews that theme's colours */
  .theme-tile {
    position: relative; height: 58px; cursor: pointer;
    background: var(--surface); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    -webkit-appearance: none;
  }
  .theme-tile .tt-aa { font-family: 'Lora', serif; font-size: 1.05rem; line-height: 1; }
  .theme-tile .tt-aa i { font-style: normal; color: var(--accent); }
  .theme-tile .tt-name { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--text-muted); }
  .theme-tile.active { border: 2px solid var(--accent); }
  .theme-tile.active::after {
    content: '✓'; position: absolute; top: 3px; right: 6px;
    font-size: 0.7rem; color: var(--accent);
  }

  /* ── LIBRARY DRAWER ─────────────────── */
  .drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 400;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 92vw; max-width: 460px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    z-index: 500;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .drawer-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem; font-weight: 600;
    color: var(--accent);
  }
  .head-actions { display: flex; align-items: center; gap: 4px; }
  .head-new {
    background: var(--accent); color: var(--on-accent); border: none;
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
    font-family: 'Lora', serif; font-size: 0.85rem;
    -webkit-appearance: none;
  }
  .head-new:active { background: var(--accent2); }
  .drawer-close {
    background: none; border: none;
    color: var(--text-muted); font-size: 1.2rem;
    cursor: pointer; padding: 4px 8px;
    -webkit-appearance: none;
  }
  .drawer-close:active { color: var(--text); }

  .drawer-tools { padding: 12px 16px 2px; flex-shrink: 0; }
  .lib-search, .meta-input {
    width: 100%; padding: 9px 12px;
    background: var(--surface2); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 9px;
    font-family: 'Lora', serif; font-size: 0.9rem; outline: none;
    -webkit-appearance: none;
  }
  .lib-search:focus, .meta-input:focus { border-color: var(--accent); }
  .lib-search::placeholder, .meta-input::placeholder { color: var(--text-muted); font-style: italic; }

  .grp-tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 10px 0 4px;
  }
  .grp-tabs[hidden] { display: none; }
  .grp-tab {
    flex-shrink: 0; white-space: nowrap; cursor: pointer;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); border-radius: 999px; padding: 5px 12px;
    font-family: 'Lora', serif; font-size: 0.8rem;
    transition: color var(--tr), border-color var(--tr), background var(--tr);
    -webkit-appearance: none;
  }
  .grp-tab:hover { color: var(--text); }
  .grp-tab .n { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; opacity: 0.7; margin-left: 5px; }
  .grp-tab.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .drawer-body {
    flex: 1 1 auto; min-height: 0;
    padding: 4px 16px 16px;
    overflow-x: hidden; overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .lib-sec {
    font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); margin: 16px 2px 8px;
  }
  .lib-sec:first-child { margin-top: 10px; }
  .lib-empty {
    color: var(--text-muted); font-size: 0.85rem; font-style: italic;
    text-align: center; padding: 32px 8px; line-height: 1.6;
  }

  .book-row {
    position: relative; display: flex; align-items: center; gap: 8px;
    padding: 11px 10px 13px 13px; margin-bottom: 8px;
    background: var(--surface2); border: 1.5px solid transparent;
    border-radius: 10px; cursor: pointer; overflow: hidden;
    transition: border-color var(--tr);
  }
  .book-row:hover { border-color: var(--border); }
  .book-row.active { border-color: var(--accent); }
  .br-main { flex: 1; min-width: 0; }
  .br-title {
    font-family: 'Lora', serif; font-size: 0.95rem; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .book-row.active .br-title { color: var(--accent); }
  .book-row.done .br-title { opacity: 0.6; }
  .br-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
    color: var(--text-muted); margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .br-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--border); }
  .br-fill { height: 100%; background: var(--accent); }
  .book-row.done .br-fill { opacity: 0.45; }
  .chip-more {
    background: none; border: none; color: var(--text-muted);
    font-size: 1.1rem; line-height: 1; padding: 6px 7px; border-radius: 6px;
    flex-shrink: 0; cursor: pointer; -webkit-appearance: none;
  }
  .chip-more:hover { color: var(--text); background: var(--surface); }

  .chip-edit {
    background: var(--surface2); border: 1.5px solid var(--accent);
    border-radius: 10px; padding: 10px; margin: -4px 0 8px;
  }
  .chip-edit .meta-input { margin-bottom: 8px; background: var(--surface); }
  .chip-edit-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-edit-btns button {
    flex: 1; padding: 7px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: 'Lora', serif; font-size: 0.8rem;
    white-space: nowrap; -webkit-appearance: none;
  }
  .chip-edit-btns .save { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip-edit-btns .del { color: #e05c5c; flex: 0 0 auto; }

  .drawer-footer {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }
  .lib-stats {
    flex: 1; min-width: 0; line-height: 1.5;
    font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
    color: var(--text-muted);
  }
  .lib-stats .warn { color: #e0a05c; }
  .foot-btn {
    flex-shrink: 0; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); border-radius: 7px; padding: 6px 11px;
    font-family: 'Lora', serif; font-size: 0.78rem;
    -webkit-appearance: none;
  }
  .foot-btn:hover { border-color: var(--accent); }

  /* ── COMPOSE (new / edit text) ─────────── */
  .compose-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 600; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .compose-overlay.open { opacity: 1; pointer-events: auto; }
  .compose {
    position: fixed; z-index: 610; left: 50%; top: 50%;
    width: min(760px, calc(100vw - 32px)); height: min(80vh, 760px);
    transform: translate(-50%, -47%); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .compose.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .compose-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
    padding: 14px 16px;
  }
  .compose-row { display: flex; gap: 8px; }
  .compose-row #titleInput { flex: 2; }
  .compose-row #groupInput { flex: 1; }
  .file-btn { flex-shrink: 0; padding: 8px 14px; border-radius: 9px; white-space: nowrap; }
  #textInput {
    flex: 1; min-height: 120px; width: 100%;
    background: var(--surface2);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text); font-family: 'Lora', serif;
    font-size: 1rem; line-height: 1.6;
    padding: 12px 14px; resize: none; outline: none;
    -webkit-appearance: none;
  }
  #textInput:focus { border-color: var(--accent); border-style: solid; }
  #textInput::placeholder { color: var(--text-muted); font-style: italic; }
  .compose-foot {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }
  .compose-count {
    flex: 1; font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem; color: var(--text-muted);
  }
  .ghost-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius); padding: 11px 16px; cursor: pointer;
    font-family: 'Lora', serif; font-size: 0.9rem; -webkit-appearance: none;
  }
  .load-btn {
    padding: 11px 20px;
    background: var(--accent); color: var(--on-accent); border: none;
    border-radius: var(--radius); font-family: 'Playfair Display', serif;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background var(--tr);
    -webkit-appearance: none;
  }
  .load-btn:active { background: var(--accent2); }
  @media (max-width: 600px) {
    .compose {
      left: 0; top: 0; bottom: 0; width: 100vw; height: auto;
      border-radius: 0; border: none; transform: translateY(24px);
    }
    .compose.open { transform: none; }
    .compose-row { flex-direction: column; }
  }

  /* ── READER PANE ───────────────────────── */
  .main-col { max-width: var(--col-max, 760px); margin: 0 auto; }
  .reader-wrap { padding: 12px 16px 0; position: relative; }
  .follow-pill {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: var(--accent); color: var(--on-accent); border: none;
    border-radius: 999px; padding: 7px 14px; cursor: pointer;
    font-family: 'Lora', serif; font-size: 0.82rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    -webkit-appearance: none;
  }
  .follow-pill[hidden] { display: none; }
  #readerPane {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    height: 60vh; height: 60dvh;
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    line-height: 1.85;
    font-size: 17px;
  }
  #readerPane::-webkit-scrollbar { display: none; }

  .reader-empty {
    color: var(--text-muted); font-style: italic;
    text-align: center; padding: 40px 0;
    font-size: 0.95rem;
  }
  .empty-actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; font-style: normal; }
  .para { margin-bottom: 0.8em; white-space: pre-wrap; }
  .para:last-child { margin-bottom: 0; }

  .progress-track {
    height: 2px; background: var(--border);
    border-radius: 2px; margin: 8px 16px 0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    transition: width 0.3s; width: 0%; border-radius: 2px;
  }

  .progress-meta {
    display: flex; justify-content: space-between;
    padding: 4px 16px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; color: var(--text-muted);
  }

  /* Word / sentence highlighting */
  .word { cursor: pointer; border-radius: 3px; padding: 0 1px; }
  .word.active-word {
    color: var(--hl-word);
    text-decoration: underline; text-decoration-thickness: 2px;
    text-underline-offset: 3px; text-decoration-color: var(--hl-word);
  }
  .sentence { border-radius: 3px; }
  .sentence.active-sentence { background: var(--hl-sentence); }

  /* ── CONTROLS BAR ──────────────────────── */
  /* Sticky: if the page is taller than the screen (small phones, Safari
     toolbars), the player stays pinned to the bottom edge. */
  .controls-bar {
    position: sticky; bottom: 0; z-index: 200;
    background: var(--bg);
    padding: 10px 16px calc(4px + env(safe-area-inset-bottom));
  }

  .playback-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .pb-btn {
    flex: 1; height: 52px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--tr);
    -webkit-appearance: none;
  }
  .pb-btn:active { background: var(--border); }
  .pb-btn.play-btn {
    flex: 2; background: var(--accent);
    border-color: var(--accent); color: var(--on-accent);
    font-size: 1.5rem;
  }
  .pb-btn.play-btn:active { background: var(--accent2); }
  .pb-btn.play-btn.playing { background: var(--surface2); border-color: var(--accent); color: var(--accent); }

  .status-row {
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; color: var(--text-muted);
  }
  #statusText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-tools { position: relative; display: flex; gap: 6px; flex-shrink: 0; }
  .tool-btn, .speed-val {
    cursor: pointer; white-space: nowrap;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 4px 9px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.66rem;
    -webkit-appearance: none;
  }
  .tool-btn.on, .tool-btn[aria-expanded="true"], .speed-val[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .speed-val { padding: 1px 7px; font-weight: 700; }
  /* Popovers anchored above their button (the controls sit low on screen) */
  .ctrl-menu {
    position: absolute; z-index: 360; right: 0; bottom: calc(100% + 8px);
    min-width: 170px; max-width: min(320px, calc(100vw - 32px));
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,0.35);
    padding: 6px; font-family: 'Lora', serif;
  }
  .ctrl-menu[hidden] { display: none; }
  .chapters-menu { width: min(320px, calc(100vw - 32px)); max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; }
  .speed-menu { left: 0; right: auto; bottom: calc(100% + 4px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; min-width: 210px; }
  .speed-menu[hidden] { display: none; }
  .slider-block { position: relative; }
  .menu-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: none; color: var(--text);
    border-radius: 7px; padding: 9px 10px; font-family: 'Lora', serif; font-size: 0.88rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    -webkit-appearance: none;
  }
  .menu-item:hover { background: var(--surface2); }
  .menu-item.active { color: var(--accent); background: var(--hl-sentence); }
  .speed-menu .menu-item { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; border: 1px solid var(--border); }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted); flex-shrink: 0;
  }
  .status-dot.playing { background: #6dbf7c; animation: pulse 1.2s infinite; }
  .status-dot.paused  { background: var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

  .sliders-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 10px;
  }
  .slider-lbl {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; color: var(--text-muted); margin-bottom: 5px;
  }
  .slider-lbl strong { color: var(--text); }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 4px;
    border-radius: 4px; background: var(--border); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid var(--bg); box-shadow: 0 0 0 2px var(--accent);
  }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }

  /* ── VOICE SECTION ─────────────────────── */
  .voice-section { padding: 0 16px 16px; }
  .voice-section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-muted);
    padding: 12px 0 8px;
    border-top: 1px solid var(--border);
  }

  .voice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .voice-option {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 9px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer; min-width: 0;
    transition: border-color var(--tr), background var(--tr);
    -webkit-tap-highlight-color: transparent;
  }
  .voice-option:active { background: var(--surface); }
  .voice-option.selected {
    border-color: var(--accent);
    background: var(--hl-sentence);
  }
  .voice-option.unavailable { opacity: 0.45; }
  .voice-avatar {
    width: 28px; height: 28px; border-radius: 50%;

  .voice-info { min-width: 0; }
  .voice-name { font-size: 0.82rem; font-weight: 500; color: var(--text); }
  .voice-tag {
    font-size: 0.55rem; font-family: 'JetBrains Mono', monospace;

    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* ── TOAST (sits above drawer + compose) ── */
  .toast {
    position: fixed; z-index: 700; left: 50%;
    top: calc(var(--header-h) + 10px);
    transform: translate(-50%, -8px); opacity: 0; pointer-events: none;

</style>

<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
// words[i] = { el, spoken, sentIdx, globalIdx, sentenceEl }
// sentences[i] = { el, words: [wordObj…] }  — a "sentence" is a speech unit:
// one real sentence, or a ≤MAX_UNIT_WORDS chunk of a run-on one.
let words = [], sentences = [];
let curWord = 0;
let playing = false;
let activeUtterance = null;
let curBookId = null;
let speechRate = parseFloat(localStorage.getItem('vox_speed') || '1.0');
let fontSize   = parseInt(localStorage.getItem('vox_fontSize') || '17', 10);
let currentTheme = localStorage.getItem('vox_theme') || 'dark';
// Reading font (reader pane only; UI keeps its own fonts)
const FONTS = [
  ['lora',      'Lora',      "'Lora', Georgia, serif"],
  ['literata',  'Literata',  "'Literata', Georgia, serif"],
  ['georgia',   'Georgia',   "Georgia, serif"],
  ['times',     'Times',     "'Times New Roman', Times, serif"],
  ['palatino',  'Palatino',  "Palatino, 'Palatino Linotype', 'Book Antiqua', serif"],
  ['helvetica', 'Helvetica', "'Helvetica Neue', Helvetica, Arial, sans-serif"],
  ['system',    'System',    "-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif"],
  ['avenir',    'Avenir',    "'Avenir Next', Avenir, 'Century Gothic', sans-serif"],
  ['atkinson',  'Atkinson',  "'Atkinson Hyperlegible', Verdana, sans-serif"],
];
let currentFont = localStorage.getItem('vox_font') || 'lora';
const SPACING = { tight: 1.5, normal: 1.85, loose: 2.25 };  // reader line-height
let currentSpacing = localStorage.getItem('vox_spacing') || 'normal';
let boldText = localStorage.getItem('vox_bold') === '1';
const PAGE_WIDTHS = { narrow: '760px', medium: '1080px', wide: 'none' };  // .main-col max-width
let currentWidth = localStorage.getItem('vox_width') || 'narrow';
// "sepia" used to be the dark brown theme (now "mocha"); vox_theme_rev marks
// stored values that already use the new names.
if (currentTheme === 'sepia' && !localStorage.getItem('vox_theme_rev')) currentTheme = 'mocha';
const THEMES = [
  ['light', 'Light'], ['sepia', 'Sepia'], ['parchment', 'Parchment'],
  ['sage', 'Sage'], ['dark', 'Dark'], ['mocha', 'Mocha'],
  ['slate', 'Slate'], ['forest', 'Forest'], ['ocean', 'Ocean'],
];
let synth = window.speechSynthesis;
let pendingRestartTimer = null;
let posSliderActive = false;

const MAX_UNIT_WORDS = 50;

// iOS Web Speech needs a buffer after cancel() before a new utterance.
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const VOICE_SWITCH_DELAY = IS_IOS ? 300 : 40;

// ════ WEBKIT RATE MAP ════════════════════
// Safari (iOS + macOS) routes Web Speech through AVSpeechSynthesizer,
// which maps rate 1→2 onto default→max (several times normal speed).
// Chrome maps linearly. We compress the slider value on WebKit only,
// using a calibration table tuned from on-device WPM measurements.
const IS_WEBKIT = IS_IOS || (/AppleWebKit/.test(navigator.userAgent) && !/Chrome|Edg/.test(navigator.userAgent));
const WEBKIT_RATE_TABLE = [[1.0, 1.0], [1.5, 1.12], [2.0, 1.25], [2.5, 1.4], [3.0, 1.6]];
function engineRate(sliderRate) {
  if (!IS_WEBKIT || sliderRate <= 1) return sliderRate;
  const T = WEBKIT_RATE_TABLE;
  for (let i = 1; i < T.length; i++) {
    if (sliderRate <= T[i][0]) {
      const t = (sliderRate - T[i - 1][0]) / (T[i][0] - T[i - 1][0]);
      return T[i - 1][1] + t * (T[i][1] - T[i - 1][1]);
    }
  }
  return T[T.length - 1][1];
}

let wantPlaying = false;
let resumeOnReturn = false;
let measuredWpm = null;
let lastWpmRate = null;
let lastWpmVoice = null;
let lastHighlightWord = null;
let lastHighlightSentence = null;
let draftSaveTimer = null;
const EMPTY_READER = document.getElementById('readerEmpty');

// ════ BACKGROUND KEEP-ALIVE (experimental) ═
const KEEPALIVE = true;
let keepAliveEl = null;
if (KEEPALIVE) {
  const sr = 8000, sec = 1, ch = 1;
  const numSamples = sr * sec;
  const dataSize = numSamples * ch * 2;
  const buf = new ArrayBuffer(44 + dataSize);
  const dv = new DataView(buf);
  const ws = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
  ws(0, 'RIFF');
  dv.setUint32(4, 36 + dataSize, true);
  ws(8, 'WAVE');
  ws(12, 'fmt ');
  dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);
  dv.setUint16(22, ch, true);
  dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * ch * 2, true);
  dv.setUint16(32, ch * 2, true);
  dv.setUint16(34, 16, true);
  ws(36, 'data');
  dv.setUint32(40, dataSize, true);
  keepAliveEl = document.createElement('audio');
  keepAliveEl.id = 'keepAlive';
  keepAliveEl.loop = true;
  keepAliveEl.setAttribute('playsinline', '');
  keepAliveEl.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  document.body.appendChild(keepAliveEl);
}
function startKeepAlive() {
  if (KEEPALIVE && keepAliveEl) keepAliveEl.play().catch(() => {});
  if (KEEPALIVE && 'mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
}
function stopKeepAlive() {
  if (KEEPALIVE && keepAliveEl) keepAliveEl.pause();
  if (KEEPALIVE && 'mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
}

function scheduleRestart(idx, delayMs) {
  if (pendingRestartTimer) clearTimeout(pendingRestartTimer);
  pendingRestartTimer = setTimeout(() => {
    pendingRestartTimer = null;
    if (wantPlaying) speakFrom(idx);
  }, delayMs);
}
function cancelPendingRestart() {
  if (pendingRestartTimer) { clearTimeout(pendingRestartTimer); pendingRestartTimer = null; }
}
// ════ STALL WATCHDOG ═════════════════════
// Engines sometimes swallow an utterance (audio interruption, lock screen,
// daemon hiccup): no onend, no error — the UI sits on "Playing…" in silence.
// Track progress events; if none arrive in time, re-speak from curWord.
const STALL_MS = 6000;
// Chrome on Mac can wedge its whole speech engine (speaking=true, nothing
// ever starts; only a browser restart clears it). If nothing has started
// since play was pressed, give up after fewer, faster retries and say so.
const START_STALL_MS = 4000;
const MAX_START_RETRIES = 2;
let startedSincePlay = false;
const MAX_STALL_RETRIES = 3;
let lastSpeechProgress = 0;
let stallRetries = 0;
setInterval(() => {
  if (!playing || !wantPlaying || !activeUtterance || pendingRestartTimer) return;
  if (performance.now() - lastSpeechProgress < activeUtterance._stallLimit) return;
  if (++stallRetries > (startedSincePlay ? MAX_STALL_RETRIES : MAX_START_RETRIES)) {
    pauseReading();
    const fix = IS_WEBKIT ? 'Close and reopen this tab, then press play.'
      : /Chrome/.test(navigator.userAgent) ? 'This is a Chrome bug: quit Chrome (⌘Q), reopen it, then press play. Safari also works meanwhile.'
      : 'Quit the browser (⌘Q), reopen it, then press play.';
    setStatus('Speech engine stuck', 'paused');
    toast('The speech engine is stuck and isn\'t starting. ' + fix);
    return;
  }
  setStatus(startedSincePlay ? 'Reconnecting speech…' : 'Still starting…', 'playing');
  restartAt(curWord, VOICE_SWITCH_DELAY);
}, 1000);

function restartAt(g, delayMs) {
  cancelPendingRestart();
  activeUtterance = null;
  synth.cancel();
  scheduleRestart(g, delayMs);
}

}

  document.getElementById('drawerOverlay').classList.remove('open');
  if (!composeMode) document.body.style.overflow = '';

  else openDrawer();
}
function newEntry() { openCompose('new'); }

// ════════════════════════════════════════
// VOICES — fixed 3-voice grid
// ════════════════════════════════════════
// The grid ALWAYS shows these three. Whether each is selectable depends on
// what this device's OS exposes to the browser (it differs per device and
// can't be changed from JS): iOS hides Nicky/Aaron from ALL web apps;
// current macOS doesn't ship Aaron at all. Add ?debug=1 to dump raw voices.
const PREFERRED = [
  { name: 'Nicky',    gender: '♀', color: '#e87cb0', bg: '#4a1e35' },
  { name: 'Samantha', gender: '♀', color: '#4f9de8', bg: '#1a3050' },
];
let voiceMap = {};   // name -> best matching SpeechSynthesisVoice
let selectedVoiceName = localStorage.getItem('vox_voice_name') || '';

function voiceQuality(v) {
  const s = (v.voiceURI + ' ' + v.name).toLowerCase();
  if (s.includes('premium'))  return 3;
  if (s.includes('enhanced')) return 2;
  return 1;
}

function refreshVoices() {
  const all = synth.getVoices();
  if (!all.length) return false;

  if (/[?&]debug/.test(location.search)) {
    const dbg = document.getElementById('voiceDebug');
    dbg.style.display = 'block';
    dbg.textContent = `RAW VOICES EXPOSED (${all.length}):\n` +
      all.map(v => `• ${v.name} | ${v.lang} | local:${v.localService}`).join('\n');
  }

  voiceMap = {};
  PREFERRED.forEach(p => {
    const matches = all.filter(v => v.name.split(' (')[0] === p.name && /^en/i.test(v.lang));
    if (matches.length) {
      matches.sort((a, b) => voiceQuality(b) - voiceQuality(a));
      voiceMap[p.name] = matches[0];
    }
  });

  if (!voiceMap[selectedVoiceName]) {
    selectedVoiceName = PREFERRED.map(p => p.name).find(n => voiceMap[n]) || '';
  }
  renderVoiceGrid();
  return true;
}

function initVoices() {
  if (refreshVoices()) return;
  synth.onvoiceschanged = () => { refreshVoices(); };
  setTimeout(() => { if (!Object.keys(voiceMap).length) refreshVoices(); }, 1000);
}

function unavailReason(name) {
  if (IS_IOS) return name === 'Nicky' ? 'iPhone hides it from web apps' : 'Not on this iPhone';
  return 'Not installed on this Mac';
}
function unavailDetail(name) {
  if (IS_IOS && name === 'Nicky') return 'Nicky works in iOS Speak Selection, but Apple blocks it for ALL web apps. Use Samantha here, or Speak Selection in Obsidian for Nicky.';
  if (IS_IOS) return name + ' isn\'t available to web apps on this iPhone.';
  return name + ': download it in System Settings → Accessibility → Spoken Content → Manage Voices, then fully restart the browser.';
}

function renderVoiceGrid() {
  const grid = document.getElementById('voiceGrid');
  grid.innerHTML = '';
  let anyAvailable = false;
  PREFERRED.forEach(p => {
    const available = !!voiceMap[p.name];
    if (available) anyAvailable = true;
    const div = document.createElement('div');
    div.className = 'voice-option'
      + (available ? '' : ' unavailable')
      + (p.name === selectedVoiceName ? ' selected' : '');
    div.innerHTML = `
      <div class="voice-avatar" style="background:${p.bg};color:${p.color}">${p.gender}</div>
      <div class="voice-info">
        <div class="voice-name">${p.name}</div>
        <span class="voice-tag">${available ? (/^en-GB/i.test(voiceMap[p.name].lang) ? 'Ready · UK' : 'Ready') : unavailReason(p.name)}</span>
      </div>`;
    div.addEventListener('click', () => selectVoice(p.name));
    grid.appendChild(div);
  });
  const note = document.getElementById('voiceNote');
  if (!anyAvailable) {
    note.style.display = 'block';
    note.textContent = 'None of your voices exist on this device — using the system default voice.';
  } else {
    note.style.display = 'none';
  }
}

function selectVoice(name) {
  if (!voiceMap[name]) {
    toast(unavailDetail(name));
    return;
  }
  selectedVoiceName = name;
  measuredWpm = null;
  try { localStorage.setItem('vox_voice_name', name); } catch (e) {}
  renderVoiceGrid();
  if (wantPlaying) restartAt(curWord, VOICE_SWITCH_DELAY);
}

function getSelectedVoice() { return voiceMap[selectedVoiceName] || null; }

initVoices();

// ════════════════════════════════════════
// LIBRARY — books persisted in localStorage
// ════════════════════════════════════════
function getBooks() {
  try { return JSON.parse(localStorage.getItem('vox_books') || '[]'); }
  catch (e) { return []; }
}
function saveBooks(books) {
  try { localStorage.setItem('vox_books', JSON.stringify(books)); return true; }
  catch (e) { return false; }
}
function getPos(id) {
  return parseInt(localStorage.getItem('vox_pos_' + id) || '0', 10);
}
// vox_post_<id> = when that position last CHANGED (sync: newer position wins).
function savePos() {
  if (!curBookId) return;
  try {
    if (localStorage.getItem('vox_pos_' + curBookId) === String(curWord)) return;
    localStorage.setItem('vox_pos_' + curBookId, curWord);
    localStorage.setItem('vox_post_' + curBookId, String(Date.now()));
  } catch (e) {}
}
function getPosTime(id) { return parseInt(localStorage.getItem('vox_post_' + id) || '0', 10); }
function titleFromLine(text) {
  const line = text.split('\n').find(l => l.trim()) || 'Untitled';
  return line.replace(/[#*_`>\[\]|]/g, '').trim().slice(0, 42) || 'Untitled';
}
// Obsidian notes often start with YAML frontmatter: use its title: field,
// else the first line after the block (never the "---" fence).
function makeTitle(text) {
  const fm = text.match(FRONTMATTER);
  if (!fm) return titleFromLine(text);
  const t = fm[0].match(/^title:[ \t]*(.+)$/m);
  const v = t ? t[1].trim().replace(/^(["'])(.*)\1$/, '$2').trim() : '';
  return v ? v.slice(0, 42) : titleFromLine(text.slice(fm[0].length));
}
// Same rule buildReader uses for a word: a whitespace token with a letter/digit.
const WORD_CHAR = /[\p{L}\p{N}]/u;
function countWords(text) {
  return text.split(/\s+/).filter(t => WORD_CHAR.test(t)).length;
}

// ════ LIBRARY LIST ═══════════════════════
const UNGROUPED = '\x00ungrouped';
let editingBookId = null;
let libTab = localStorage.getItem('vox_lib_tab') || '';  // '' = All

function bookPos(b) { return b.id === curBookId && words.length ? curWord : getPos(b.id); }
function bookPct(b) {
  return b.words ? Math.min(100, Math.round(bookPos(b) / Math.max(b.words - 1, 1) * 100)) : 0;
}
function fmtMins(m) {
  m = Math.max(1, Math.round(m));
  return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
}
function fmtAgo(t) {
  const sec = (Date.now() - t) / 1000;
  if (sec < 90) return 'just now';
  if (sec < 3600) return Math.round(sec / 60) + ' min ago';
  if (sec < 86400) return Math.round(sec / 3600) + ' h ago';
  const d = Math.round(sec / 86400);
  if (d === 1) return 'yesterday';
  if (d < 7) return d + ' days ago';
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function setLibTab(t) {
  libTab = t;
  try { localStorage.setItem('vox_lib_tab', t); } catch (e) {}
  editingBookId = null;
  renderLibrary();
}

function renderLibrary() {
  const books = getBooks();
  const q = document.getElementById('libSearch').value.trim().toLowerCase();
  const groups = [...new Set(books.map(b => b.group).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const ungroupedN = books.filter(b => !b.group).length;
  if (libTab === UNGROUPED ? !(groups.length && ungroupedN) : libTab && !groups.includes(libTab)) libTab = '';

  const dl = document.getElementById('groupList');
  dl.innerHTML = '';
  groups.forEach(g => { const o = document.createElement('option'); o.value = g; dl.appendChild(o); });

  const tabs = document.getElementById('grpTabs');
  tabs.innerHTML = '';
  const addTab = (key, label, n) => {
    const t = document.createElement('button');
    t.className = 'grp-tab' + (libTab === key ? ' active' : '');
    t.innerHTML = '<span></span><span class="n">' + n + '</span>';
    t.firstChild.textContent = label;
    t.addEventListener('click', () => setLibTab(key));
    tabs.appendChild(t);
  };
  if (groups.length) {
    addTab('', 'All', books.length);
    groups.forEach(g => addTab(g, g, books.filter(b => b.group === g).length));
    if (ungroupedN) addTab(UNGROUPED, 'Ungrouped', ungroupedN);
  }
  tabs.hidden = !groups.length || !!q;

  const inTab = b => !libTab || (libTab === UNGROUPED ? !b.group : b.group === libTab);
  const shown = books
    .filter(b => q ? (b.title + ' ' + (b.group || '') + ' ' + b.text).toLowerCase().includes(q) : inTab(b))
    .sort((a, b) => (b.opened || b.added) - (a.opened || a.added));
  const showGroup = !libTab || !!q;

  const list = document.getElementById('libList');
  list.innerHTML = '';
  const section = (label, items) => {
    if (label) {
      const h = document.createElement('div');
      h.className = 'lib-sec';
      h.textContent = label;
      list.appendChild(h);
    }
    items.forEach(b => list.appendChild(bookRow(b, showGroup)));
  };
  if (!shown.length) {
    list.innerHTML = '<div class="lib-empty"></div>';
    list.firstChild.textContent = q ? 'No matches.'
      : books.length ? 'Nothing in this group yet.'
      : 'Your library is empty.\nTap + New to add a text.';
    list.firstChild.style.whiteSpace = 'pre-line';
  } else if (!q && !libTab && shown.length > 4) {
    const cont = shown.filter(b => bookPos(b) > 0 && bookPct(b) < 99).slice(0, 3);
    if (cont.length) {
      section('Continue reading', cont);
      section('All texts', shown.filter(b => !cont.includes(b)));
    } else section(null, shown);
  } else section(null, shown);

  renderLibStats(books);
}

function renderLibStats(books) {
  let chars = 0;
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); chars += k.length + (localStorage.getItem(k) || '').length; } }
  catch (e) {}
  const pct = Math.round(chars / 5e6 * 100);  // browsers allow ~5M chars per site
  const last = parseInt(localStorage.getItem('vox_last_export') || '0', 10);
  const el = document.getElementById('libStats');
  el.innerHTML = '';
  const line1 = document.createElement('div');
  line1.textContent = books.length + (books.length === 1 ? ' text' : ' texts') + ' · ' + Math.max(pct, books.length ? 1 : 0) + '% of storage';
  if (pct >= 70) line1.className = 'warn';
  const line2 = document.createElement('div');
  line2.textContent = last ? 'Backed up ' + fmtAgo(last) : 'Not backed up yet';
  // iPhone Safari may clear site data after ~7 days unvisited, so nag sooner there
  if (books.length && (!last || Date.now() - last > (IS_IOS ? 7 : 14) * 86400000)) line2.className = 'warn';
  el.append(line1, line2);
}

function bookRow(b, showGroup) {
  const frag = document.createDocumentFragment();
  const pos = bookPos(b), pct = bookPct(b);
  const done = pos > 0 && pct >= 99;
  const row = document.createElement('div');
  row.className = 'book-row' + (b.id === curBookId ? ' active' : '') + (done ? ' done' : '');
  row.innerHTML = `
    <div class="br-main"><div class="br-title"></div><div class="br-meta"></div></div>
    <button class="chip-more" title="Rename, group, edit, delete" aria-label="More">⋯</button>
    <div class="br-bar"><div class="br-fill" style="width:${pct}%"></div></div>`;
  row.querySelector('.br-title').textContent = b.title;
  row.title = b.title;
  const wpm = measuredWpm || 175 * speechRate;
  const bits = [];
  if (showGroup && b.group) bits.push(b.group);
  if (done) bits.push('✓ Finished');
  else if (pos > 0) bits.push(pct + '% · ' + fmtMins((b.words - pos) / wpm) + ' left');
  else bits.push('~' + fmtMins((b.words || 1) / wpm));
  bits.push(b.opened ? fmtAgo(b.opened) : 'added ' + fmtAgo(b.added));
  row.querySelector('.br-meta').textContent = bits.join(' · ');
  row.addEventListener('click', () => openBook(b.id));
  row.querySelector('.chip-more').addEventListener('click', (ev) => {
    ev.stopPropagation();
    editingBookId = editingBookId === b.id ? null : b.id;
    renderLibrary();
  });
  frag.appendChild(row);
  if (editingBookId === b.id) frag.appendChild(editPanel(b));
  return frag;
}

function editPanel(b) {
  const p = document.createElement('div');
  p.className = 'chip-edit';
  p.innerHTML = `
    <input class="meta-input e-title" placeholder="Title (blank = first line)" autocomplete="off">
    <input class="meta-input e-group" list="groupList" placeholder="Group (blank = ungrouped)" autocomplete="off">
    <div class="chip-edit-btns">
      <button class="save">Save</button><button class="edit">Edit text</button>
      <button class="cancel">Cancel</button><button class="del">Delete</button>
    </div>`;
  const ti = p.querySelector('.e-title'), gi = p.querySelector('.e-group');
  ti.value = b.title; gi.value = b.group || '';
  const save = () => {
    const books = getBooks();
    const book = books.find(x => x.id === b.id);
    if (!book) return;
    const t = ti.value.trim();
    if (t && t !== book.title) { book.title = t.slice(0, 120); book.customTitle = true; }
    else if (!t) { book.title = makeTitle(book.text); book.customTitle = false; }
    const g = gi.value.trim().slice(0, 60);
    if (g) book.group = g; else delete book.group;
    book.updated = Date.now();
    if (!saveBooks(books)) { toast('Storage full — changes not saved'); return; }
    if (book.id === curBookId) setMediaTitle(book.title);
    editingBookId = null;
    renderLibrary();
  };
  const cancel = () => { editingBookId = null; renderLibrary(); };
  p.querySelector('.save').addEventListener('click', save);
  p.querySelector('.edit').addEventListener('click', () => openCompose(b.id));
  p.querySelector('.cancel').addEventListener('click', cancel);
  p.querySelector('.del').addEventListener('click', (ev) => deleteBook(b.id, ev));
  p.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    else if (e.key === 'Escape') { e.stopPropagation(); cancel(); }
  });
  setTimeout(() => { ti.focus(); ti.select(); }, 0);
  return p;
}

function deleteBook(id, ev) {
  ev.stopPropagation();
  const book = getBooks().find(b => b.id === id);
  if (!confirm('Delete "' + (book ? book.title : 'this book') + '" from the library?')) return;
  if (curBookId === id) {
    clearReader();
    curBookId = null;
    try { localStorage.removeItem('vox_last_book'); } catch (e) {}
  }
  saveBooks(getBooks().filter(b => b.id !== id));
  try { localStorage.removeItem('vox_pos_' + id); localStorage.removeItem('vox_post_' + id); } catch (e) {}
  editingBookId = null;
  renderLibrary();
  if (book) toast('Deleted "' + book.title + '"');
}

// Open book's title: header (tap = library) + lock-screen media info.
// null = no book open → header shows the logo again.
function setMediaTitle(title) {
  const ht = document.getElementById('hdrTitle');
  ht.hidden = !title;
  document.getElementById('logo').hidden = !!title;
  ht.textContent = title || '';
  ht.title = title ? title + ' — open library' : '';
  if (KEEPALIVE && 'mediaSession' in navigator) {
    navigator.mediaSession.metadata = title ? new MediaMetadata({ title, artist: 'Vox Reader' }) : null;
  }
}

// ════ BACKUP ═════════════════════════════
function exportLibrary() {
  const books = getBooks();
  if (!books.length) { toast('Library is empty — nothing to export'); return; }
  savePos();
  const positions = {}, posTimes = {};
  books.forEach(b => { positions[b.id] = getPos(b.id); posTimes[b.id] = getPosTime(b.id); });
  const data = { app: 'vox-reader', version: 2, exported: new Date().toISOString(), books, positions, posTimes };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = 'vox-library-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  try { localStorage.setItem('vox_last_export', String(Date.now())); } catch (e) {}
  toast('Exported ' + plural(books.length, 'text'));
  renderLibrary();
}

// Sync from a backup (e.g. exported on the other device). Never deletes.
// - Text not here yet (by id or identical text) → added.
// - Text here on both → newer edit (book.updated) wins text/title/group;
//   newer reading position (vox_post_) wins, or the further one when the
//   file predates position timestamps.
async function importLibrary(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  const incoming = data && Array.isArray(data.books)
    ? data.books.filter(b => b && typeof b.id === 'string' && typeof b.text === 'string' && b.text.trim())
    : null;
  if (!incoming) { toast('Import failed — not a Vox library file'); return; }
  savePos();
  const books = getBooks();
  const byId = new Map(books.map(b => [b.id, b])), byText = new Map(books.map(b => [b.text, b]));
  const positions = data.positions || {}, posTimes = data.posTimes || {};
  const newPos = [];  // [id, pos, time] to write once the books are saved
  let added = 0, updated = 0, curChanged = false;
  incoming.forEach(b => {
    const inPos = Math.max(0, +positions[b.id] || 0), inPosT = +posTimes[b.id] || 0;
    const local = byId.get(b.id) || byText.get(b.text);
    if (!local) {
      const nb = {
        id: b.id, text: b.text,
        title: String(b.title || makeTitle(b.text)).slice(0, 120),
        words: +b.words || countWords(b.text),
        added: +b.added || Date.now(),
      };
      if (b.opened) nb.opened = +b.opened;
      if (b.updated) nb.updated = +b.updated;
      if (b.group) nb.group = String(b.group).slice(0, 60);
      if (b.customTitle) nb.customTitle = true;
      books.push(nb); byId.set(nb.id, nb); byText.set(nb.text, nb);
      if (inPos > 0) newPos.push([nb.id, inPos, inPosT]);
      added++;
      return;
    }
    let changed = false;
    if ((+b.updated || 0) > (+local.updated || 0)) {
      local.text = b.text;
      local.words = countWords(b.text);
      local.title = String(b.title || makeTitle(b.text)).slice(0, 120);
      if (b.customTitle) local.customTitle = true; else delete local.customTitle;
      if (b.group) local.group = String(b.group).slice(0, 60); else delete local.group;
      local.updated = +b.updated;
      changed = true;
    }
    const locPos = getPos(local.id), locPosT = getPosTime(local.id);
    const takePos = (inPosT || locPosT) ? inPosT > locPosT : inPos > locPos;
    if (takePos && inPos !== locPos) { newPos.push([local.id, inPos, inPosT || Date.now()]); changed = true; }
    if (+b.opened > (local.opened || 0)) local.opened = +b.opened;
    if (changed) { updated++; if (local.id === curBookId) curChanged = true; }
  });
  if (!added && !updated) { toast('Already up to date — nothing new in that file'); return; }
  if (!saveBooks(books)) { toast('Import failed — storage full'); return; }
  newPos.forEach(([id, p, t]) => {
    try { localStorage.setItem('vox_pos_' + id, String(p)); localStorage.setItem('vox_post_' + id, String(t)); } catch (e) {}
  });
  const parts = [];
  if (added) parts.push('added ' + plural(added, 'text'));
  if (updated) parts.push('updated ' + updated);
  const msg = parts.join(' · ');
  // Show the synced text/position for the open book, unless it's playing
  if (curChanged && !wantPlaying) openBook(curBookId);
  else renderLibrary();
  toast(msg.charAt(0).toUpperCase() + msg.slice(1) + (curChanged && wantPlaying ? ' (open text applies after you pause and reopen it)' : ''));
}

// ════ COMPOSE (new / edit text) ══════════
let composeMode = null;  // null | 'new' | <book id being edited>

function openCompose(mode) {
  const ti = document.getElementById('titleInput');
  const gi = document.getElementById('groupInput');
  const ta = document.getElementById('textInput');
  if (mode === 'new') {
    ti.value = '';
    gi.value = libTab && libTab !== UNGROUPED ? libTab : '';
    let draft = '';
    try { draft = localStorage.getItem('vox_text') || ''; } catch (e) {}
    ta.value = draft;
    document.getElementById('composeHeading').textContent = 'New text';
    document.getElementById('composeSave').textContent = 'Save & open →';
  } else {
    const b = getBooks().find(x => x.id === mode);
    if (!b) return;
    ti.value = b.customTitle ? b.title : '';
    gi.value = b.group || '';
    ta.value = b.text;
    document.getElementById('composeHeading').textContent = 'Edit text';
    document.getElementById('composeSave').textContent = 'Save changes →';
  }
  composeMode = mode;
  updateComposeCount();
  document.getElementById('compose').classList.add('open');
  document.getElementById('composeOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => { ta.focus(); if (mode !== 'new') ta.setSelectionRange(0, 0); ta.scrollTop = 0; }, 60);
}
// Links are useless in a read-aloud reader and clutter the text: on import
// (file or paste) [text](url) → text, [[Note|alias]] → alias, [[Note]] → Note;
// images and ![[embeds]] are dropped. This is an explicit, visible edit in the
// compose box before saving — not a silent display rewrite.
const MD_LINK = /(!?)\[([^\[\]\n]*)\]\((?:<[^>\n]*>|(?:[^()\s]|\([^()\s]*\))*)(?:[ \t]+(?:"[^"\n]*"|'[^'\n]*'))?\)/g;

function unlinkMarkdown(text) {
  let n = 0;
  const out = text
    .replace(WIKI_LINK, (m, bang, inner) => {
      n++;
      if (bang) return '';
      const [target, alias] = inner.split('|');
      return (alias || target.replace(/#\^.*$/, '').replace(/#/g, ' ')).trim();
    })
    .replace(MD_LINK, (m, bang, label) => { n++; return bang ? '' : label; })
    .replace(/<(https?:\/\/[^\s<>]+)>/g, '$1');

function linkToast(n) { if (n) toast(`Removed ${n} link${n === 1 ? '' : 's'} — kept the words`); }

// Fill compose from a file; the filename becomes the title (Obsidian notes
// are named by title) unless one is already typed.
function loadFileIntoCompose(file) {
  if (!file) return;
  if (!/\.(md|markdown|txt)$/i.test(file.name) && !/^text\//.test(file.type)) { toast('Only .md or .txt files can be opened'); return; }
  if (file.size > 4e6) { toast('That file is too big (over 4 MB)'); return; }
  file.text().then(t => {
    if (!composeMode) openCompose('new');
    const ta = document.getElementById('textInput'), ti = document.getElementById('titleInput');
    const u = unlinkMarkdown(t.replace(/^\uFEFF/, ''));
    ta.value = u.text;
    linkToast(u.links);
    if (!ti.value.trim()) ti.value = file.name.replace(/\.(md|markdown|txt)$/i, '').trim().slice(0, 120);
    ta.dispatchEvent(new Event('input'));  // word count + draft
    ta.scrollTop = 0;

}
document.addEventListener('dragover', (e) => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault();
});
document.addEventListener('drop', (e) => {
  const fs = e.dataTransfer && e.dataTransfer.files;
  if (!fs || !fs.length) return;
  e.preventDefault();
  loadFiles(fs);
});
// One file → compose (review before saving). Several → each becomes its own
// text straight away, in filename order ("001 - Letter 1" first), filed under
// the compose Group box if filled. Notes named "_…" (folder index notes like
// _Work.md / _Author.md) are skipped; identical texts already saved are reused.
const isTextFile = f => /\.(md|markdown|txt)$/i.test(f.name) || /^text\//.test(f.type);
function loadFiles(list) {
  const all = [...(list || [])];
  if (all.length === 1) { loadFileIntoCompose(all[0]); return; }
  const files = all.filter(f => isTextFile(f) && !/^_/.test(f.name) && f.size <= 4e6)
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  if (!files.length) { toast('No .md or .txt files to import'); return; }
  importFiles(files, all.length - files.length);
}
function importFiles(files, skipped) {
  const g = composeMode ? document.getElementById('groupInput').value.trim().slice(0, 60) : '';
  Promise.all(files.map(f => f.text().then(t => [f, t], () => [f, null]))).then(results => {
    const books = getBooks();
    const byText = new Set(books.map(b => b.text));
    const now = Date.now();
    let added = 0, dup = 0, links = 0;
    const fresh = [];
    results.forEach(([f, t], i) => {
      if (t == null) { skipped++; return; }
      const u = unlinkMarkdown(t.replace(/^﻿/, ''));
      if (!u.text.trim()) { skipped++; return; }
      if (byText.has(u.text)) { dup++; return; }
      byText.add(u.text);
      links += u.links;
      // Library lists newest first: stagger `added` so file order is kept.
      const book = { id: now.toString(36) + i.toString(36) + Math.random().toString(36).slice(2, 6),
        title: f.name.replace(/\.(md|markdown|txt)$/i, '').trim().slice(0, 120), customTitle: true,
        text: u.text, words: countWords(u.text), added: now - i, updated: now };
      if (g) book.group = g;
      fresh.push(book);
      added++;
    });
    if (!saveBooks(fresh.concat(books))) { toast('Storage full — nothing imported. Export a backup, then delete old texts'); return; }
    if (composeMode) closeCompose();
    if (added) setLibTab(g || '');
    openDrawer();
    const extra = [dup && dup + ' already in library', skipped && skipped + ' skipped'].filter(Boolean).join(', ');
    toast(`Imported ${added} text${added === 1 ? '' : 's'}${g ? ' into "' + g + '"' : ''}` +
      (links ? ` · removed ${links} links` : '') + (extra ? ` (${extra})` : ''));
